name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: OpenIDEA version, or the revision you built it from, and plugin version (Settings › Plugins).
      placeholder: OpenIDEA built at 859f634, OpenIDEA-CfxLUA 0.1.2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal resource
      description: The smallest fxmanifest.lua and script that show the problem.
      render: lua
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: For crashes or slowness, the plugin's line in Settings › Plugins and IDE log lines mentioning sensity.cfxlua.
      render: text
