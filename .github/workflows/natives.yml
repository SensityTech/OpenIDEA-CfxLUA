name: Natives snapshot

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: natives-snapshot

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download the databases
        run: scripts/update-natives.sh
      - name: Look for changes
        id: changes
        run: |
          if git diff --quiet -- data/natives; then
            echo "The bundled natives are up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- data/natives
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test with the new databases
        if: steps.changes.outputs.changed == 'true'
        run: cargo test --lib --locked
      - name: Commit to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/natives
          git commit -m 'chore(natives): refresh the bundled native databases'
          git push origin HEAD:main
