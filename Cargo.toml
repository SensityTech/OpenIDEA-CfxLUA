[package]
name = "openidea-cfxlua"
version = "1.0.0"
edition = "2024"
description = "FiveM / RedM (CfxLua) support for OpenIDEA: natives, client/server awareness, state bags, events, fxmanifest, NUI and built-in documentation."
license = "Apache-2.0"
repository = "https://github.com/SensityTech/OpenIDEA-CfxLUA"
publish = false

# The plugin builds on its own (target wasm32-wasip2), outside any workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The OpenIDEA plugin SDK (API openidea:plugin@1.4). Not published on crates.io:
# pinned to the revision of OpenIDEA 0.1.40, the release the plugin is built and tested against.
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", rev = "37c2a6048eea89d4f6db645622612358b643862b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[features]
# Counts every allocation and logs what each part of the plugin keeps once a project is read.
mem-trace = []

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
