id = "sensity.cfxlua"
name = "OpenIDEA-CfxLUA"
version = "0.1.3"
description = "FiveM and RedM (CfxLua) support: natives of the right game and side, client/server awareness, the Cfx runtime API, state bags, events, fxmanifest, NUI, magic values, CfxLua syntax checks, Asset Escrow and built-in documentation."
authors = ["SensityTech"]
homepage = "https://github.com/SensityTech/OpenIDEA-CfxLUA"
license = "Apache-2.0"
change-notes = "0.1.3 — big projects no longer crash the plugin at start: they are indexed in slices while you work."
categories = ["frameworks", "linters", "tools"]
engines.openidea = "^1.4"
wasm = "dist/plugin.wasm"
activation = ["on-language:lua", "on-view:docs", "on-schedule:21600"]

[capabilities]
# project.read: index the resources (manifests, scripts, NUI pages) and publish problems.
# editor.read / editor.write: commands and the tool window act on the focused editor.
# storage: natives updates and tool window preferences. events: saved files, focused editor.
required = ["project.read", "editor.read", "editor.write", "storage", "events"]
# Natives updates (the Cfx.re database and the RDR3 NativeDB); copy buttons of the tool window.
optional = ["net:static.cfx.re", "net:raw.githubusercontent.com", "clipboard"]

[[contributes.providers]]
kinds = [
    "completion",
    "definition",
    "type-definition",
    "hover",
    "signature-help",
    "inlay-hints",
    "line-markers",
    "code-actions",
    "semantic-tokens",
    "formatting",
    "folding",
    "document-symbols",
    "document-highlights",
    "selection-ranges",
    "injections",
    "colors",
]
languages = ["lua"]

# The NUI bridge: callbacks and messages in the pages of resources.
[[contributes.providers]]
kinds = ["completion", "definition", "line-markers", "code-actions"]
languages = ["javascript", "typescript", "javascriptreact", "typescriptreact", "vue", "svelte", "html"]

# What a gutter marker of the type engine is drawn with, where OpenIDEA has no icon of its own.
[[contributes.markerIcons]]
id = "lua-class"
icon = "icons/markers/class.svg"
iconDark = "icons/markers/class_dark.svg"

[[contributes.markerIcons]]
id = "lua-recursive-call"
icon = "icons/markers/recursive.svg"
iconDark = "icons/markers/recursive_dark.svg"

[[contributes.markerIcons]]
id = "lua-tail-call"
icon = "icons/markers/tailCall.svg"
iconDark = "icons/markers/tailCall_dark.svg"

# The live templates of the JetBrains plugin: func, lfunc, for, fori, forp, if, elseif, ifelse, closure.
[[contributes.snippets]]
language = "lua"
path = "snippets/lua.json"

[[contributes.views]]
id = "docs"
title = "CfxLua"
icon = "file-lua"
location = "left"
web = "web/index.html"

[[contributes.statusBar]]
id = "side"
text = "CfxLua"
tooltip = "OpenIDEA-CfxLUA"
command = "show-docs"
align = "right"
priority = 100

[[contributes.commands]]
id = "show-docs"
title = "CfxLua: Show Documentation"
category = "CfxLua"

[[contributes.menus]]
menu = "editor.context"
command = "show-docs"

[[contributes.commands]]
id = "natives.update"
title = "CfxLua: Update Natives"
category = "CfxLua"

[[contributes.menus]]
menu = "tools"
command = "natives.update"

[[contributes.commands]]
id = "coords.convert-selection"
title = "CfxLua: Convert Coordinates"
category = "CfxLua"
when = "textEditorActive && (editorFocus || popupOpen || !toolWindowFocus)"

[[contributes.commands]]
id = "luals.definitions"
title = "CfxLua: Generate lua-language-server Definitions"
category = "CfxLua"

[[contributes.commands]]
id = "escrow.check"
title = "CfxLua: Check Resource Before Escrow Upload"
category = "CfxLua"

[[contributes.menus]]
menu = "tools"
command = "escrow.check"

[[contributes.fileIcons]]
id = "fxmanifest"
patterns = ["fxmanifest.lua", "__resource.lua"]
icon = "icons/fxmanifest.svg"
iconDark = "icons/fxmanifest_dark.svg"

[[contributes.fileIcons]]
id = "lua-client"
patterns = ["client.lua", "cl_*.lua", "client_*.lua", "*_client.lua", "*_cl.lua"]
icon = "icons/luaClient.svg"
iconDark = "icons/luaClient_dark.svg"

[[contributes.fileIcons]]
id = "lua-server"
patterns = ["server.lua", "sv_*.lua", "server_*.lua", "*_server.lua", "*_sv.lua"]
icon = "icons/luaServer.svg"
iconDark = "icons/luaServer_dark.svg"

[[contributes.fileIcons]]
id = "lua-shared"
patterns = ["shared.lua", "sh_*.lua", "shared_*.lua", "*_shared.lua", "*_sh.lua"]
icon = "icons/luaShared.svg"
iconDark = "icons/luaShared_dark.svg"

[[contributes.fileTemplates]]
id = "fxmanifest-fivem"
name = "fxmanifest.lua (FiveM)"
extension = "lua"
path = "templates/fxmanifest-fivem.lua"

[[contributes.fileTemplates]]
id = "fxmanifest-redm"
name = "fxmanifest.lua (RedM)"
extension = "lua"
path = "templates/fxmanifest-redm.lua"

[[contributes.fileTemplates]]
id = "client-script"
name = "Client script"
extension = "lua"
path = "templates/client.lua"

[[contributes.fileTemplates]]
id = "server-script"
name = "Server script"
extension = "lua"
path = "templates/server.lua"

[[contributes.fileTemplates]]
id = "shared-config"
name = "Shared config"
extension = "lua"
path = "templates/config.lua"

[[contributes.runDetectors]]
id = "fxserver"
name = "FXServer (server.cfg)"
files = ["server.cfg"]
command = "FXServer"
args = ["+exec", "server.cfg"]

[[contributes.fileTemplates]]
id = "luarc"
name = "lua-language-server config (.luarc.json)"
extension = "json"
path = "templates/luarc.json"

[contributes.settings]
title = "OpenIDEA-CfxLUA"
schema = "settings.schema.json"
